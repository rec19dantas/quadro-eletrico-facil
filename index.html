const parts=[{id:'main',name:'Disjuntor geral',spec:'2P · C40 · ilustrativo',type:'protection',kind:'breaker',label:'C40',w:2},{id:'dps',name:'DPS T2 · 1+1',spec:'L–N + N–PE · conceitual',type:'protection',kind:'dps',label:'1+1',w:2},{id:'idr',name:'IDR bipolar',spec:'40 A · 30 mA · tipo A',type:'protection',kind:'idr',label:'40 A',w:2},{id:'c10',name:'Disjuntor 10 A',spec:'1P · curva C',type:'protection',kind:'breaker',label:'C10',w:1},{id:'c16',name:'Disjuntor 16 A',spec:'1P · curva C',type:'protection',kind:'breaker',label:'C16',w:1},{id:'c20',name:'Disjuntor 20 A',spec:'1P · curva C',type:'protection',kind:'breaker',label:'C20',w:1},...[1.5,2.5,4,6,10,16].map(n=>({id:'w'+n,name:'Cobre '+String(n).replace('.',',')+' mm²',spec:'Cabo flexível · isolado',type:'wires',n})),{id:'socket10',name:'Tomada 10 A',spec:'2P+T · uso geral',type:'infrastructure',icon:'🔌'},{id:'socket20',name:'Tomada 20 A',spec:'2P+T · carga específica',type:'infrastructure',icon:'🔌'},{id:'box',name:'Caixa de passagem',spec:'Derivação acessível',type:'infrastructure',icon:'▣'},{id:'duct',name:'Eletroduto 25 mm',spec:'PVC corrugado',type:'infrastructure',icon:'〰'},{id:'board12',name:'Quadro 12 módulos',spec:'Trilho DIN · N e PE',type:'infrastructure',icon:'▦'},{id:'board18',name:'Quadro 18 módulos',spec:'Trilho DIN · N e PE',type:'infrastructure',icon:'▦'}];
const scenarios=[{title:'Primeiro quadro',desc:'Iluminação e tomada de cozinha · F+N · TT didático',required:['main','dps','idr','c10','c16'],wire:2.5,load:1800,cat:'Essencial'},{title:'Cozinha protegida',desc:'Tomada 20 A em circuito dedicado · F+N · TT didático',required:['main','dps','idr','c20'],wire:4,load:3200,cat:'Intermediário'},{title:'Luz no caminho',desc:'Circuito de iluminação · F+N · TT didático',required:['main','dps','idr','c10'],wire:1.5,load:600,cat:'Essencial'}];
let saved;try{saved=JSON.parse(localStorage.getItem('eletrolab-v1')||'null')}catch{}let s=Object.assign({state:0,v:220,capacity:12,items:[],links:[],infra:[],wire:2.5,color:'phase',mission:0,free:false,done:[],xp:0},saved||{});s.on=false;let page='work',category='protection',selected=null,node=null,linkMode=false;const colors={phase:'#d64e42',neutral:'#28a3dc',earth:'#4c9c46'};let endpoints=['Rede F','Rede N','Geral F','Geral N','IDR F entrada','IDR N entrada','IDR F saída','IDR N saída','DPS F','DPS N','DPS PE','Barra N','Barra PE','DJ iluminação','DJ tomadas','Luz F','Luz N','Luz PE','Tomada F','Tomada N','Tomada PE'];
let requiredLinks=()=>{let a=[['Rede F','Geral F'],['Rede N','Geral N'],['Geral F','IDR F entrada'],['Geral N','IDR N entrada'],['Geral F','DPS F'],['Geral N','DPS N'],['DPS PE','Barra PE'],['IDR N saída','Barra N']];if(s.mission!==1)a.push(['IDR F saída','DJ iluminação'],['DJ iluminação','Luz F'],['Barra N','Luz N'],['Barra PE','Luz PE']);if(s.mission!==2)a.push(['IDR F saída','DJ tomadas'],['DJ tomadas','Tomada F'],['Barra N','Tomada N'],['Barra PE','Tomada PE']);return a};
const same=(l,a,b)=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a);function persist(){try{localStorage.setItem('eletrolab-v1',JSON.stringify(s))}catch{}}function enter(){$('#intro').classList.add('hidden')}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}function dev(p){return `<div class="device ${p.kind} ${p.w===2?'wide':''}"><div class="screw"></div><span class="maker">ELETROLAB · DIN</span><strong>${p.label}</strong><span>${p.kind==='idr'?'IΔn 30 mA':p.kind==='dps'?'T2 · 275 V':'230/400 V~'}</span><div class="toggle"></div><span class="flag"></span><div class="screw"></div></div>`}function show(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function heading(k,h,p){return `<div class="titlebar"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div><span class="hero-pill">✦ ${s.xp} XP &nbsp; / &nbsp; ${s.done.length} desafios</span></div>`}
function render(){if(page==='work')work();if(page==='missions')missions();if(page==='learn')learn();if(page==='region')region();$('#regionLabel').textContent=states[s.state]+' · '+s.v+' V'}
function work(){let m=scenarios[s.mission],used=s.items.reduce((a,id)=>a+parts.find(p=>p.id===id).w,0);$('#main').innerHTML=heading('Sua oficina de elétrica','Vamos montar seu quadro?','Escolha as peças. Faça as conexões. Teste sua solução.')+`<div class="workspace"><section><div class="card mission"><span class="num">0${s.mission+1}</span><div><b>${s.free?'Bancada livre':m.title}</b><p>${s.free?'Experimente peças e conexões sem pontuação.':m.desc}</p></div></div><div class="card"><div class="benchhead"><div><h2>Quadro de distribuição</h2><div class="small">${used}/${s.capacity} módulos · ${s.v} V F+N · PE separado</div></div><span class="status ${s.on?'on':''}">${s.on?'● Simulação ligada':'● Desenergizado'}</span></div><div class="panelwrap"><div class="panel"><div class="paneltitle">ELETROLAB • QUADRO RESIDENCIAL</div><div class="rail">${s.items.map((id,i)=>{let p=parts.find(p=>p.id===id);return `<button style="display:contents" onclick="inspect(${i})" aria-label="Inspecionar ${p.name}">${dev(p)}</button>`}).join('')}${Array.from({length:Math.min(6,s.capacity-used)},()=>`<button class="slot" onclick="add()" aria-label="Adicionar peça selecionada">+</button>`).join('')}</div><div class="sidebus leftbus pe">PE ${'<i></i>'.repeat(6)}</div><div class="sidebus rightbus">N ${'<i></i>'.repeat(6)}</div></div><div class="connections">${s.links.map((l,i)=>`<button class="wiretag" style="--c:${colors[l.color]}" onclick="removeLink(${i})" title="Remover conexão">${esc(l.a)} → ${esc(l.b)} · ${String(l.wire).replace('.',',')} mm² ×</button>`).join('')||'<span class="small">Sem conexões. Toque em “Conectar fios” para começar.</span>'}</div><div class="circuit ${s.on?'powered':''}">${s.circuits.map((c,i)=>`<div class="load"><span>${c.group==='light'?'💡':'🔌'}</span>C${i+1} · ${esc(c.name)}</div>`).join('')}<div class="load"><span>▣</span>${s.infra.length} acessórios</div></div></div><div class="actions"><button class="orange" onclick="connections()">⌁ Conectar fios</button><button onclick="guide()">? Guia</button><button onclick="undo()">↶ Desfazer</button><button class="primary" onclick="validate()">✓ Verificar</button><button class="lime" onclick="power()">ϟ ${s.on?'Desligar':'Simular'}</button></div><div class="hint">${selected?'Selecionado: '+parts.find(p=>p.id===selected).name+'. Toque em + no trilho.':'1. Toque em uma proteção do catálogo. 2. Toque em + para instalar.'}</div>${s.on?`<div class="testrow"><button onclick="fault('leak')">Testar fuga · 35 mA</button><button onclick="fault('overload')">Testar sobrecarga</button><button onclick="fault('surge')">Testar surto</button></div>`:''}</div><footer>Ambiente educativo. A verificação cobre apenas as regras visíveis deste desafio; não certifica uma instalação. O dimensionamento real depende de projeto, condições locais e profissional habilitado.</footer></section><section class="card catalog"><div class="benchhead"><h2>Catálogo</h2><span class="small">+ adicionar</span></div><p class="small">Componentes ilustrados com aparência DIN. Sem vínculo com fabricantes.</p><div class="catalogtabs">${[['protection','Proteções'],['wires','Cabos'],['infrastructure','Estrutura']].map(([id,n])=>`<button class="${category===id?'active':''}" onclick="category='${id}';work()">${n}</button>`).join('')}</div><div class="parts">${parts.filter(p=>p.type===category).map(p=>`<button class="part" style="${selected===p.id?'border:2px solid #176b54':''}" onclick="choose('${p.id}')"><div class="mini">${p.kind?dev(p):p.n?`<div class="coil" style="--c:${colors[s.color]}"></div>`:`<div class="iconpart">${p.icon}</div>`}</div><b>${p.name}</b><small>${p.spec}</small></button>`).join('')}</div>${category==='wires'?`<label class="space">Identificação<select onchange="s.color=this.value;persist();work()"><option value="phase" ${s.color==='phase'?'selected':''}>Fase · vermelho</option><option value="neutral" ${s.color==='neutral'?'selected':''}>Neutro · azul-claro</option><option value="earth" ${s.color==='earth'?'selected':''}>PE · verde</option></select></label>`:''}<div class="space small"><b>Montagem do desafio</b><div class="progress"><i style="width:${Math.min(100,s.items.filter(id=>m.required.includes(id)).length/m.required.length*100)}%"></i></div><p>Geral + DPS + IDR + circuitos.</p></div></section></div>`}
function choose(id){if(s.on)return toast('Desligue a simulação antes de alterar.');let p=parts.find(p=>p.id===id);selected=id;if(p.n){s.wire=p.n;toast('Cabo '+p.name+' selecionado para as próximas conexões.')}else if(p.type==='infrastructure'){if(id.startsWith('board')){let n=id==='board12'?12:18;if(s.items.reduce((a,k)=>a+parts.find(p=>p.id===k).w,0)>n)return toast('Remova módulos antes de reduzir o quadro.');s.capacity=n;toast('Quadro alterado para '+n+' módulos.')}else{s.infra.push(id);toast(p.name+' adicionado à instalação.')}}else toast(p.name+' selecionado. Toque em + no trilho.');persist();work()}
function add(){if(s.on)return toast('Desligue antes de montar.');let p=parts.find(p=>p.id===selected);if(!p||!p.w)return toast('Escolha uma proteção no catálogo.');if(s.items.includes(p.id))return toast('Este componente já está no quadro.');if(s.items.reduce((a,id)=>a+parts.find(p=>p.id===id).w,0)+p.w>s.capacity)return toast('Não há módulos livres. Escolha um quadro maior.');s.items.push(p.id);persist();work()}
function inspect(i){let p=parts.find(p=>p.id===s.items[i]);modal(`<h2>${p.name}</h2>${dev(p)}<p>${descriptions[p.id]||'Proteção contra sobrecorrente. A curva, a corrente nominal e a capacidade de interrupção dependem do projeto.'}</p><p class="small">${p.spec}. Valores de catálogo para simulação; não constituem especificação de compra.</p><button class="orange" onclick="removePart(${i})">Remover componente</button>`)}
const descriptions={main:'Seccionamento e proteção geral contra sobrecorrente. Polos e corrente dependem do fornecimento e do projeto.',dps:'Conjunto conceitual 1+1: proteção L–N e elemento de comutação N–PE; não é uma união direta N–PE. No cenário TT a montante do IDR, o conjunto representa a configuração específica aplicável. A escolha de classe, Uc, Up e proteção de retaguarda exige coordenação com a rede e o aterramento. Retaguarda, coordenação, distância de conexões e dimensionamento de PE exigem projeto; não são verificados no jogo.',idr:'Detecta desequilíbrio de corrente. O IDR não substitui proteção contra sobrecarga e curto-circuito. Os condutores ativos do circuito protegido passam pelo dispositivo; o PE fica fora dele.'};
function removePart(i){if(s.on)return toast('Desligue antes de alterar.');s.items.splice(i,1);s.links=[];persist();closeModal();work();toast('Peça removida. Refaça as conexões.')}function undo(){if(s.on)return toast('Desligue antes de alterar.');if(s.links.length)s.links.pop();else if(s.infra.length)s.infra.pop();else s.items.pop();persist();work()}function removeLink(i){if(s.on)return toast('Desligue antes de alterar.');s.links.splice(i,1);persist();work()}
function modal(html){$('#modal').innerHTML=`<div class="card"><div style="text-align:right"><button onclick="closeModal()" aria-label="Fechar">✕</button></div>${html}</div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden');node=null}
function guide(){modal(`<h2>Seu roteiro de montagem</h2><p>1. Em Proteções, selecione cada peça e toque em +: ${scenarios[s.mission].required.map(id=>parts.find(p=>p.id===id).name).join(', ')}.</p><p>2. Em Estrutura, adicione caixa de passagem, eletroduto e a tomada indicada na inspeção.</p><p>3. Toque em Conectar fios. Selecione a seção e a cor, depois origem e destino. Repita para cada ligação abaixo.</p>${requiredLinks().map(([a,b])=>{let t=a+' '+b,branch=/Luz|DJ iluminação/.test(t),w=branch?1.5:/Geral|Rede|DPS|IDR/.test(t)&&!/DJ tomadas/.test(t)?6:scenarios[s.mission].wire,c=/PE/.test(t)?'verde (PE)':/ N|Barra N/.test(t)?'azul-claro (N)':'vermelho (fase)';return `<div class="check">${a} → ${b}<br><span class="small">${c} · mínimo do exercício ${w} mm²</span></div>`}).join('')}<p>4. Verifique a montagem e corrija os itens pendentes. Toque em Simular e experimente os testes de falha.</p><p class="small">Roteiro restrito ao modelo didático; não é um diagrama executivo.</p>`)}
function connections(){if(s.on)return toast('Desligue antes de conectar.');let available=endpoints.filter(n=>!n.startsWith('Geral')||s.items.includes('main')).filter(n=>!n.startsWith('IDR')||s.items.includes('idr')).filter(n=>!n.startsWith('DPS')||s.items.includes('dps')).filter(n=>n!=='DJ iluminação'||s.items.includes('c10')).filter(n=>n!=='DJ tomadas'||s.items.includes('c16')||s.items.includes('c20'));modal(`<div class="eyebrow">Ligação por toque</div><h2>Conectar condutores</h2><p>Escolha dois pontos para criar uma ligação. Os terminais representam nós didáticos, não bornes de um fabricante.</p><div class="formrow"><label>Seção de cobre<select onchange="s.wire=Number(this.value);persist()">${[1.5,2.5,4,6,10,16].map(n=>`<option ${s.wire===n?'selected':''} value="${n}">${String(n).replace('.',',')} mm²</option>`).join('')}</select></label><label>Função / cor<select onchange="s.color=this.value;persist()">${[['phase','Fase · vermelho'],['neutral','Neutro · azul-claro'],['earth','PE · verde']].map(([v,n])=>`<option value="${v}" ${s.color===v?'selected':''}>${n}</option>`).join('')}</select></label></div><p class="small" id="wirehint">Toque no ponto de origem.</p><div class="nodegrid">${available.map(n=>`<button onclick="point('${n}',this)">${n}</button>`).join('')}</div><p class="small">Nesta oficina o DPS é um ramo de proteção, nunca uma peça em série com a carga. O exercício usa TT com N e PE separados.</p><button class="primary space" onclick="closeModal();work()">Concluir conexões</button>`)}
function point(n,el){if(!node){node=n;el.classList.add('chosen');$('#wirehint').textContent='Origem: '+n+'. Escolha o destino.';return}if(node===n){node=null;el.classList.remove('chosen');return}if(!s.links.some(l=>same(l,node,n))){s.links.push({a:node,b:n,color:s.color,wire:s.wire});persist();toast('Ligação adicionada.')}node=null;document.querySelectorAll('.nodegrid .chosen').forEach(e=>e.classList.remove('chosen'));$('#wirehint').textContent='Escolha outra origem ou conclua.'}
function checks(){let m=scenarios[s.mission],a=[];m.required.forEach(id=>a.push({ok:s.items.includes(id),text:'Instalar '+parts.find(p=>p.id===id).name}));let req=requiredLinks();req.forEach(([x,y])=>a.push({ok:s.links.some(l=>same(l,x,y)),text:'Ligação: '+x+' → '+y}));s.links.forEach(l=>{let neu=/ N|Barra N/.test(l.a+' '+l.b),earth=/PE/.test(l.a+' '+l.b);let expected=earth?'earth':neu?'neutral':'phase';a.push({ok:l.color===expected,text:'Cor adequada em '+l.a+' → '+l.b});a.push({ok:!(/PE/.test(l.a)&&/ N|Barra N/.test(l.b)||/PE/.test(l.b)&&/ N|Barra N/.test(l.a)),text:'N e PE separados: '+l.a+' → '+l.b});a.push({ok:req.some(([x,y])=>same(l,x,y)),text:'Topologia prevista no desafio: '+l.a+' → '+l.b});let branch=/Luz|DJ iluminação/.test(l.a+' '+l.b),minimum=branch?1.5:m.wire;if(/Geral|Rede|DPS|IDR/.test(l.a+' '+l.b)&&!branch&&!/DJ tomadas/.test(l.a+' '+l.b))minimum=6;a.push({ok:l.wire>=minimum,text:'Seção do exercício ≥ '+minimum+' mm²: '+l.a+' → '+l.b})});if(s.mission!==2){a.push({ok:s.infra.includes(s.mission===1?'socket20':'socket10'),text:'Adicionar tomada '+(s.mission===1?'20':'10')+' A em Estrutura'});}a.push({ok:s.infra.includes('box'),text:'Adicionar caixa de passagem'});a.push({ok:s.infra.includes('duct'),text:'Adicionar eletroduto'});return a}
function validate(){let a=checks(),good=a.every(c=>c.ok);modal(`<div class="eyebrow">Inspeção didática</div><h2>${good?'Montagem concluída!':'Vamos ajustar a montagem'}</h2><p>${a.filter(c=>c.ok).length} de ${a.length} verificações atendidas.</p>${a.map(c=>`<div class="check ${c.ok?'':'bad'}">${c.ok?'✓':'○'} ${esc(c.text)}</div>`).join('')}<p class="small">Premissas do exercício: cobre, circuito F+N, cargas simplificadas. As seções mínimas do desafio não são resultado de cálculo completo. Não são avaliados Iz, agrupamento, queda de tensão, curto-circuito, capacidade de interrupção, dimensionamento de PE/DPS ou ocupação de dutos. A posição e a coordenação do DPS dependem do esquema real.</p>`);return good}
function power(){if(s.on){s.on=false;work();return}if(!checks().every(c=>c.ok)){validate();return}s.on=true;if(!s.free&&!s.done.includes(s.mission)){s.done.push(s.mission);s.xp+=150;persist();toast('+150 XP · desafio concluído!')}work()}
function fault(t){let text;if(t==='leak'){s.on=false;text='Fuga simulada de 35 mA: IDR atuou. O PE permanece conectado. O teste real deve seguir o fabricante.'}if(t==='overload'){s.on=false;text='Sobrecarga simulada: disjuntor do circuito atuou. O IDR não protege contra sobrecarga.'}if(t==='surge')text='Evento didático: conjunto DPS 1+1 limitou o surto no modelo. Não representa desempenho ou energia suportada de um produto real.';work();modal('<h2>'+({leak:'IDR em ação',overload:'Proteção de sobrecorrente',surge:'Proteção contra surtos'}[t])+'</h2><p>'+text+'</p>')}
function missions(){$('#main').innerHTML=heading('Trilha prática','Um circuito de cada vez.','Desafios com objetivos claros e feedback em cada etapa.')+`<div class="gridcards">${scenarios.map((m,i)=>`<div class="lesson"><div class="eyebrow">0${i+1} · ${m.cat}</div><h2 class="space">${m.title}</h2><p>${m.desc}</p><p class="small">Carga didática: ${m.load} W · ${s.v} V · I ≈ ${(m.load/s.v).toFixed(1)} A</p><p class="small">${s.done.includes(i)?'✓ Concluído · 150 XP':'150 XP ao concluir'}</p><button class="primary space" onclick="start(${i},false)">Montar desafio →</button></div>`).join('')}<div class="lesson" style="background:#d8f878"><div class="eyebrow">Criação livre</div><h2 class="space">Sua própria bancada</h2><p>Combine componentes, cabos e acessórios. A inspeção continua usando o cenário selecionado, sem pontuação.</p><button class="primary space" onclick="start(0,true)">Explorar livremente →</button></div></div>`}
function start(i,free){modal(`<h2>Preparar nova bancada?</h2><p>A montagem atual será substituída. Os desafios concluídos e XP serão mantidos.</p><button class="primary space" onclick="newBench(${i},${free})">Começar montagem</button>`)}function newBench(i,free){s.items=[];s.links=[];s.infra=[];s.on=false;s.mission=i;s.free=free;selected=null;persist();closeModal();show('work')}
const lessons=[['⚡','Proteções com funções diferentes','Disjuntor protege contra sobrecorrente. IDR detecta corrente diferencial. DPS limita sobretensões transitórias. Eles são complementares.'],['⌁','Cores que identificam','No modelo: fase vermelha, neutro azul-claro e proteção PE verde. Verde e verde-amarelo são exclusivos de proteção. A fase pode usar outras cores permitidas.'],['◉','Seção não é só corrente','Em cobre, os mínimos usuais para circuitos fixos são 1,5 mm² para iluminação e 2,5 mm² para tomadas. São mínimos; temperatura, agrupamento, método de instalação e queda de tensão podem exigir mais.'],['▣','IDR e aterramento','O IDR não substitui aterramento. Neste cenário TT, o PE fica fora do IDR e separado do neutro; os condutores ativos do circuito protegido atravessam o IDR.'],['〰','Dutos e caixas','Caixas de passagem permitem acesso às derivações. Ocupação dos dutos, raio de curvatura e condições de instalação precisam de dimensionamento próprio. O catálogo não calcula esses critérios.'],['☀','Calor, umidade e maresia','O Nordeste reúne condições diferentes. Temperatura, corrosão no litoral, exposição à água e ambiente da instalação influenciam proteção e seleção dos materiais. Não existe uma única regra regional que substitua o projeto.']];

function region(){$('#main').innerHTML=heading('Contexto regional','Elétrica no Nordeste.','Escolha a localidade e a tensão do exercício.')+`<div class="gridcards"><div class="card"><h2>Configurar oficina</h2><div class="formrow"><label>Estado<select onchange="s.state=Number(this.value);s.on=false;persist();render()">${states.map((n,i)=>`<option value="${i}" ${s.state===i?'selected':''}>${n}</option>`).join('')}</select></label><label>Tensão fase–neutro<select onchange="s.v=Number(this.value);s.on=false;persist();render()"><option ${s.v===127?'selected':''}>127</option><option ${s.v===220?'selected':''}>220</option></select></label></div><p><b>${suppliers[s.state]}</b></p><p>A seleção do estado identifica a referência regional. Não aplica automaticamente uma norma local nem determina a tensão do endereço. Confirme município, rede e padrão de entrada com a distribuidora.</p><div class="hint">A tensão altera a corrente estimada da carga nos desafios. Os exercícios continuam F+N e não incluem rede fase–fase ou trifásica.</div><button class="primary space" onclick="show('work')">Voltar à bancada →</button></div><div class="card"><h2>O que consultar</h2><div class="infoitems"><div><b>01 · Instalação interna</b><p>NBR 5410 e demais normas aplicáveis.</p></div><div><b>02 · Conexão à rede</b><p>Padrão de entrada, medição, limites de carga e tensão da distribuidora local.</p></div><div><b>03 · Ambiente</b><p>Calor, umidade, maresia e grau de proteção adequado ao local.</p></div></div><p class="small">Os valores de 40/63 A, 275 V e as seções presentes na oficina são premissas didáticas, não padrões obrigatórios para o Nordeste.</p><a href="https://www.gov.br/aneel/pt-br/canais_atendimento/fale-com-a-sua-distribuidora" target="_blank" rel="noopener">Consultar distribuidoras na ANEEL ↗</a></div></div>`}

function normalizeState(){
s.state=Number.isInteger(s.state)&&s.state>=0&&s.state<9?s.state:0;s.mission=Number.isInteger(s.mission)&&s.mission>=0&&s.mission<briefs.length?s.mission:0;s.v=[127,220].includes(s.v)?s.v:220;s.capacity=[12,18].includes(s.capacity)?s.capacity:12;
s.circuits=(Array.isArray(s.circuits)?s.circuits:[]).filter(c=>c&&typeof c==='object').slice(0,12).map((c,i)=>({name:String(c.name||'Circuito '+(i+1)).slice(0,60),group:['light','socket','wet','dedicated'].includes(c.group)?c.group:'light',power:Number.isFinite(c.power)&&c.power>=0?c.power:0,section:[1.5,2.5,4,6,10,16].includes(c.section)?c.section:1.5,amp:[6,10,16,20,25,32].includes(c.amp)?c.amp:10}));
s.items=[...new Set((Array.isArray(s.items)?s.items:[]).filter(id=>['main','dps','idr',...s.circuits.map((_,i)=>'plan'+i)].includes(id)))];s.infra=(Array.isArray(s.infra)?s.infra:[]).filter(id=>['box','duct','socket10','socket20'].includes(id)).slice(0,100);s.links=(Array.isArray(s.links)?s.links:[]).filter(l=>l&&typeof l.a==='string'&&typeof l.b==='string'&&l.a.length<35&&l.b.length<35&&['phase','neutral','earth'].includes(l.color)&&[1.5,2.5,4,6,10,16].includes(l.wire));s.done=[...new Set((Array.isArray(s.done)?s.done:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<briefs.length))];s.xp=s.done.length*150;s.wire=[1.5,2.5,4,6,10,16].includes(s.wire)?s.wire:2.5;s.color=['phase','neutral','earth'].includes(s.color)?s.color:'phase';s.on=false;
// Earlier releases used a single L–PE DPS. Those connections must be rebuilt.
if(s.schema!==4){s.links=s.links.filter(l=>!l.a.startsWith('DPS')&&!l.b.startsWith('DPS'));s.schema=4}
}
normalizeState();
function supplyAmps(){return briefs[s.mission].loads.reduce((a,l)=>a+l[1],0)/s.v>40?63:40}
function feederSection(){return supplyAmps()===63?16:6}

const oldWork=work;

function syncPlan(){parts.splice(parts.findIndex(p=>p.id==='c10'),3);s.circuits.forEach((c,i)=>parts.push({id:'plan'+i,name:'DJ circuito '+(i+1),spec:esc(c.name)+' · '+c.amp+' A',type:'protection',kind:'breaker',label:'C'+c.amp,w:1}));scenarios[s.mission].required=['main','dps','idr',...s.circuits.map((_,i)=>'plan'+i)];endpoints=['Rede F','Rede N','Geral F','Geral N','IDR F entrada','IDR N entrada','IDR F saída','IDR N saída','DPS F','DPS N','DPS PE','Barra N','Barra PE',...s.circuits.flatMap((c,i)=>['DJ C'+(i+1),'C'+(i+1)+' F','C'+(i+1)+' N','C'+(i+1)+' PE'])]}
// Catalog rebuild is idempotent when the planning screen re-renders.
const baseParts=parts.filter(p=>!['c10','c16','c20'].includes(p.id));
syncPlan=function(){for(let id of ['main','idr']){let p=baseParts.find(p=>p.id===id);p.label=(id==='main'?'C':'')+supplyAmps()+(id==='idr'?' A':'');p.spec=(id==='main'?'2P · C':'30 mA · tipo A · ')+supplyAmps()+' A · didático'}parts.splice(0,parts.length,...baseParts);s.circuits.forEach((c,i)=>parts.push({id:'plan'+i,name:'DJ circuito '+(i+1),spec:esc(c.name)+' · '+c.amp+' A',type:'protection',kind:'breaker',label:'C'+c.amp,w:1}));scenarios[s.mission].required=['main','dps','idr',...s.circuits.map((_,i)=>'plan'+i)];endpoints=['Rede F','Rede N','Geral F','Geral N','IDR F entrada','IDR N entrada','IDR F saída','IDR N saída','DPS F','DPS N','DPS PE','Barra N','Barra PE',...s.circuits.flatMap((c,i)=>['DJ C'+(i+1),'C'+(i+1)+' F','C'+(i+1)+' N','C'+(i+1)+' PE'])]};
requiredLinks=()=>[['Rede F','Geral F'],['Rede N','Geral N'],['Geral F','IDR F entrada'],['Geral N','IDR N entrada'],['Geral F','DPS F'],['Geral N','DPS N'],['DPS PE','Barra PE'],['IDR N saída','Barra N'],...s.circuits.flatMap((c,i)=>[['IDR F saída','DJ C'+(i+1)],['DJ C'+(i+1),'C'+(i+1)+' F'],['Barra N','C'+(i+1)+' N'],['Barra PE','C'+(i+1)+' PE']])];
work=function(){syncPlan();oldWork();let b=briefs[s.mission];let box=document.createElement('section');box.className='card missiontop';box.innerHTML=`<div class="eyebrow">Missão · projetar e montar</div><strong>${b.house}</strong><p>Crie um quadro para ${b.loads.reduce((a,l)=>a+l[1],0)} W em ${s.v} V. Defina quantos circuitos serão necessários e dimensione cada um.</p><p class="small">Cargas fornecidas pelo cenário: ${b.loads.map(l=>l[0]+' '+l[1]+' W').join(' · ')}. Separe iluminação, tomadas secas, áreas molhadas e cada carga dedicada. Você pode subdividir os grupos.</p><div id="planrows">${s.circuits.map((c,i)=>`<div class="planrow"><label>Circuito ${i+1} · nome<input aria-label="Nome circuito ${i+1}" value="${esc(c.name)}" oninput="draftCircuit(${i},'name',this.value)"></label><label>Grupo<select onchange="updateCircuit(${i},'group',this.value)">${b.loads.map(l=>`<option value="${l[2]}" ${c.group===l[2]?'selected':''}>${l[0]}</option>`).join('')}</select></label><label>Potência (W)<input type="number" min="1" value="${c.power}" oninput="draftCircuit(${i},'power',this.value)"></label><label>Cabo (mm²)<select onchange="updateCircuit(${i},'section',this.value)">${[1.5,2.5,4,6,10,16].map(n=>`<option ${c.section===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Disjuntor (A)<select onchange="updateCircuit(${i},'amp',this.value)">${[6,10,16,20,25,32].map(n=>`<option ${c.amp===n?'selected':''}>${n}</option>`).join('')}</select></label><div class="small">I ≈ ${(c.power/s.v).toFixed(1)} A</div><button onclick="deleteCircuit(${i})">Remover</button></div>`).join('')}</div><div class="actions"><button class="primary" onclick="addCircuit()">+ Criar circuito</button><button onclick="reviewPlan()">Avaliar dimensionamento</button></div><p class="small">Modelo simplificado: cargas resistivas, fator de potência 1, sem demanda, cobre/PVC, método B1, 2 condutores carregados, 30 °C e sem agrupamento. Capacidade de referência do exercício: 1,5→17,5 A; 2,5→24 A; 4→32 A; 6→41 A; 10→57 A; 16→76 A. Não substitui o dimensionamento completo.</p>`;$('#main').prepend(box)};
function planChanged(){selected=null;s.on=false;s.items=s.items.filter(id=>!id.startsWith('plan'));s.links=[];persist();work()}
function addCircuit(){if(s.circuits.length>=12)return toast('Limite desta bancada: 12 circuitos.');s.circuits.push({name:'Circuito '+(s.circuits.length+1),group:'light',power:0,section:1.5,amp:10});planChanged()}
function updateCircuit(i,k,v){s.circuits[i][k]=['name','group'].includes(k)?v:Number(v);planChanged()}
function deleteCircuit(i){s.circuits.splice(i,1);planChanged()}
function planChecks(){let b=briefs[s.mission],a=[];b.loads.forEach(([name,p,g])=>{let circuits=s.circuits.filter(c=>c.group===g),total=circuits.reduce((t,c)=>t+c.power,0);a.push({ok:Math.abs(total-p)<0.01,text:name+': distribuir exatamente '+p+' W (planejado '+total+' W)'});if(g==='dedicated')a.push({ok:circuits.length===1,text:name+': um circuito exclusivo'})});let iz={1.5:17.5,2.5:24,4:32,6:41,10:57,16:76};s.circuits.forEach((c,i)=>{a.push({ok:Number.isFinite(c.power)&&c.power>0,text:'C'+(i+1)+': potência maior que zero'});a.push({ok:c.section>=(c.group==='light'?1.5:2.5),text:'C'+(i+1)+': seção mínima do grupo'});a.push({ok:c.power/s.v<=c.amp&&c.amp<=iz[c.section],text:'C'+(i+1)+': Ib ≤ In ≤ Iz no modelo do exercício'})});a.push({ok:s.circuits.reduce((t,c)=>t+c.power,0)/s.v<=supplyAmps(),text:'Corrente total sem demanda dentro do geral '+supplyAmps()+' A desta bancada'});return a}
function reviewPlan(){let a=planChecks();modal('<h2>Avaliação do planejamento</h2>'+a.map(c=>`<div class="check ${c.ok?'':'bad'}">${c.ok?'✓':'○'} ${esc(c.text)}</div>`).join('')+'<p class="small">A avaliação não inclui queda de tensão, curto-circuito, fatores de correção, balanceamento ou dimensionamento da entrada.</p>')}
checks=function(){let a=planChecks();scenarios[s.mission].required.forEach(id=>a.push({ok:s.items.includes(id),text:'Instalar '+parts.find(p=>p.id===id).name}));let req=requiredLinks();req.forEach(([x,y])=>a.push({ok:s.links.some(l=>same(l,x,y)),text:'Ligação: '+x+' → '+y}));s.links.forEach(l=>{let t=l.a+' '+l.b,expected=/PE/.test(t)?'earth':/ N|Barra N/.test(t)?'neutral':'phase',match=t.match(/(?:DJ )?C(\d+)/),min=match&&!t.includes('IDR F saída')?s.circuits[Number(match[1])-1]?.section:feederSection();a.push({ok:l.color===expected,text:'Cor: '+l.a+' → '+l.b});a.push({ok:req.some(([x,y])=>same(l,x,y)),text:'Topologia: '+l.a+' → '+l.b});a.push({ok:l.wire>=min,text:'Seção ≥ '+min+' mm²: '+l.a+' → '+l.b})});a.push({ok:s.infra.includes('duct')&&s.infra.includes('box'),text:'Instalar eletroduto e caixa de passagem'});return a};
guide=function(){modal('<h2>Planejar, montar e testar</h2><p>1. Leia as cargas da missão no topo e crie seus circuitos. Escolha grupo, potência, cabo e disjuntor.</p><p>2. Avalie o dimensionamento. Depois selecione as proteções geradas no catálogo e instale-as no trilho.</p><p>3. Adicione caixa e eletroduto. Conecte os pontos abaixo usando as cores de fase, neutro e PE. Nos circuitos, use a seção que você planejou; na alimentação, confira a seção indicada pelo ajudante.</p>'+requiredLinks().map(([a,b])=>'<div class="check">'+a+' → '+b+'</div>').join('')+'<p>4. Verifique e simule. O PE está na lateral esquerda e o neutro na direita.</p>')};

let stage=0,editCircuit=0;const stepNames=['Planejar','Proteções','Estrutura','Conectar','Testar'];
const detailedWork=work;
function stageProblems(){if(stage===0)return planChecks().filter(c=>!c.ok);if(stage===1)return scenarios[s.mission].required.filter(id=>!s.items.includes(id)).map(id=>({text:'Instale '+parts.find(p=>p.id===id).name+'.'}));if(stage===2)return ['box','duct'].filter(id=>!s.infra.includes(id)).map(id=>({text:'Adicione '+parts.find(p=>p.id===id).name+'.'}));return checks().filter(c=>!c.ok)}
function nextTask(){let bad=stageProblems();if(stage===0){if(!s.circuits.length)return 'Comece criando seu primeiro circuito. Escolha o grupo de uso e distribua uma parte da carga da missão.';if(bad.length)return bad[0].text+'. Edite um circuito ou crie outro para continuar.';return 'Seu planejamento atende aos critérios deste exercício. Podemos começar a montagem!'}if(stage===1&&selected&&!s.items.includes(selected))return 'Peça selecionada: '+parts.find(p=>p.id===selected).name+'. Agora toque em + no trilho para instalar.';if(stage===1)return bad[0]?.text||'Todas as proteções estão no trilho. Vamos preparar a estrutura.';if(stage===2)return bad[0]?.text||'Estrutura pronta. Agora vamos conectar os condutores.';if(stage===3)return bad[0]?.text||'Conexões conferidas. Seu quadro está pronto para o teste.';return s.on?'Simulação ligada! Experimente os testes de fuga, sobrecarga e surto.':bad.length?'Há um ajuste pendente: '+bad[0].text:'Tudo pronto. Toque em Simular para testar seu quadro.'}
work=function(){if(stage===1)category='protection';if(stage===2)category='infrastructure';detailedWork();let main=$('#main'),mission=main.querySelector('.missiontop'),workspace=main.querySelector('.workspace');let top=main.querySelector('.titlebar');if(top)top.style.display='none';let missionStrip=workspace.querySelector('.mission');if(missionStrip)missionStrip.style.display='none';let technical=mission.lastElementChild;if(technical){let d=document.createElement('details');d.innerHTML='<summary>Premissas do exercício</summary>';technical.before(d);d.append(technical);technical.style.display='block'};let rows=mission.querySelector('#planrows');if(rows){let editor=Array.from(rows.children);editor.forEach((el,i)=>{el.style.display=i===editCircuit?'':'none'});if(editor.length){let tabs=document.createElement('div');tabs.className='circuitnav';tabs.innerHTML=s.circuits.map((c,i)=>`<button class="${editCircuit===i?'active':''}" onclick="editCircuit=${i};work()">C${i+1} · ${esc(c.name)}</button>`).join('');rows.before(tabs)}}if(stage!==0){mission.style.display='none'}else{let ps=mission.querySelectorAll('p');if(ps[1]){let details=document.createElement('details');details.innerHTML='<summary>Ver cargas da casa</summary>';ps[1].before(details);details.append(ps[1])}}workspace.classList.add(stage===0?'phase-plan':stage<=2?'phase-build':'phase-wire');if(stage===1||stage===2){let tabs=workspace.querySelector('.catalogtabs');if(tabs)tabs.style.display='none'}let actions=workspace.querySelector('.actions');if(actions)Array.from(actions.children).forEach(b=>{let text=b.textContent;b.style.display=(stage===3&&text.includes('Conectar'))||(stage===4&&(text.includes('Simular')||text.includes('Desligar')))||text.includes('Desfazer')?'':'none'});let coach=document.createElement('div');coach.innerHTML=`<div class="eyebrow">Sua montagem · ${briefs[s.mission].house}</div><div class="steps">${stepNames.map((n,i)=>`<button class="${stage===i?'active':''}" onclick="setStage(${i})">${i+1}. ${n}</button>`).join('')}</div><div class="coach" role="status" aria-live="polite"><div class="avatar">ϟ</div><div class="coachContent"><div class="eyebrow">Seu ajudante · etapa ${stage+1} de 5</div><b>${stepNames[stage]}, sem complicação.</b><p>${nextTask()}</p><button class="lime" onclick="coachAction()">${stage===0?(s.circuits.length?'Conferir e continuar →':'+ Criar circuito'):stage===1?'Escolher próxima proteção':stage===2?'Adicionar próximo acessório':stage===3?'Fazer próxima ligação':s.on?'ϟ Desligar':'ϟ Simular'}</button> ${stage<4?'<button onclick="advance()">Continuar →</button>':''}<button onclick="helpNow()">Preciso de ajuda</button></div></div>`;main.prepend(coach)};
function setStage(i){stage=i;selected=null;work()}
function advance(){if(stageProblems().length){helpNow();return}stage=Math.min(4,stage+1);work()}
function helpNow(){let text=nextTask();modal('<div class="eyebrow">Estou aqui para ajudar</div><h2>Um passo de cada vez</h2><p>'+text+'</p><p>'+['Clique em Criar circuito. Dê um nome e informe grupo, potência, cabo e disjuntor. Os botões C1, C2… permitem editar um circuito por vez. Use “Avaliar dimensionamento” quando quiser conferir.','Selecione a peça indicada no catálogo e toque em + dentro do quadro. Cada circuito planejado tem um disjuntor próprio.','Toque na caixa e no eletroduto do catálogo. Eles serão adicionados à sua instalação.','Escolha a seção e a cor do cabo. Depois toque no ponto de origem e no destino. Vou indicar uma ligação por vez.','Toque em Simular. Se houver algum ajuste, vou mostrar o primeiro item para você corrigir.'][stage]+'</p>')}

let wireZoomed=false;
makeWirePoints=function(){let pts=[],groups=[];function block(title,x,y,w,h,ports,type){groups.push({title,x,y,w,h,type});ports.forEach(([name,dx,dy])=>pts.push({name,x:x+dx,y:y+dy}))}let rows=Math.ceil((3+s.circuits.length)/7),bodyHeight=145+rows*140;block('REDE · F + N',280,8,240,48,[['Rede F',60,12],['Rede N',180,12]],'supply');let devices=[{title:'GERAL '+supplyAmps()+' A',type:'main',ports:[['Geral F',25,10],['Geral N',70,10]]},{title:'IDR · 30 mA',type:'idr',ports:[['IDR F entrada',25,10],['IDR N entrada',70,10],['IDR F saída',25,90],['IDR N saída',70,90]]},{title:'DPS · 1+1',type:'dps',ports:[['DPS F',25,10],['DPS N',70,10],['DPS PE',48,90]]},...s.circuits.map((c,i)=>({title:'C'+(i+1)+' · '+c.amp+' A',type:'breaker',ports:[['DJ C'+(i+1),48,10]]}))];devices.forEach((d,i)=>block(d.title,64+(i%7)*96,110+Math.floor(i/7)*140,94,100,d.ports,d.type));block('PE',10,100,38,bodyHeight-100,[['Barra PE',19,55]],'pe');block('N',752,100,38,bodyHeight-100,[['Barra N',19,55]],'neutral');s.circuits.forEach((c,i)=>block('C'+(i+1)+' · '+c.name,72+(i%7)*96,bodyHeight+30+Math.floor(i/7)*90,86,64,[['C'+(i+1)+' F',15,10],['C'+(i+1)+' N',43,10],['C'+(i+1)+' PE',71,10]],'load'));return{pts,groups,height:bodyHeight+55+Math.ceil(s.circuits.length/7)*90}};
const simpleWireSVG=wireSVG;wireSVG=function(){let svg=simpleWireSVG();let m=makeWirePoints();svg=svg.replace('role="img"','role="group"').replace('fill="#d5dfdb"','fill="#f2f3eb"');let body=svg.indexOf('<rect width="800"');let enclosure=`<rect x="4" y="70" width="792" height="${145+Math.ceil((3+s.circuits.length)/7)*140-70}" rx="23" fill="#edeFE7" stroke="#b7c0b1" stroke-width="3"/><rect x="51" y="96" width="695" height="${Math.ceil((3+s.circuits.length)/7)*140-15}" rx="8" fill="#17251e"/>`;let bgEnd=svg.indexOf('/>',body)+2;svg=svg.slice(0,bgEnd)+enclosure+svg.slice(bgEnd);for(let g of m.groups){if(!['main','idr','breaker','dps'].includes(g.type))continue;let original=`<rect x="${g.x+g.w/2-14}" y="${g.y+g.h/2}" width="28" height="24" rx="3" fill="${g.type==='dps'?'#d64e42':g.type==='idr'?'#267bb2':'#273d35'}"/>`;let replacement=`<path d="M${g.x+7} ${g.y+28}h${g.w-14}" stroke="#bec6b8"/><rect x="${g.x+g.w/2-18}" y="${g.y+48}" width="36" height="29" rx="3" fill="${g.type==='dps'?'#d74c3f':g.type==='idr'?'#2767a2':'#15221b'}" stroke="#526254" stroke-width="2"/><path d="M${g.x+g.w/2-13} ${g.y+58}h26" stroke="#ffffff55" stroke-width="3"/><rect x="${g.x}" y="${g.y+122}" width="${g.w}" height="16" fill="#eeefe7"/><text x="${g.x+g.w/2}" y="${g.y+134}" text-anchor="middle" font-size="9" font-weight="900" fill="#1c3827">${g.type==='main'?'GERAL':g.type==='idr'?'DR':g.type==='dps'?'DPS':esc(g.title.split(' · ')[0])}</text>`;svg=svg.replace(original,replacement)}return svg};
const priorCompactWork=work;work=function(){priorCompactWork();if(stage===1||stage===2){let panel=$('#main').querySelector('.panel');if(panel){let labels=document.createElement('div');labels.className='striplabels';labels.innerHTML=s.items.map(id=>{let p=parts.find(p=>p.id===id);return '<span style="flex:'+p.w+'">'+(id==='main'?'Geral':id==='idr'?'DR':id==='dps'?'DPS':esc(s.circuits[Number(id.slice(4))]?.name||id))+'</span>'}).join('')+'<span style="flex:'+Math.min(6,s.capacity-s.items.reduce((a,id)=>a+parts.find(p=>p.id===id).w,0))+'">Reserva</span>';panel.append(labels)}let h=$('#main').querySelector('.catalog h2');if(h)h.textContent=stage===1?'Proteções · selecione e toque em +':'Estrutura · toque para adicionar'}if(stage===3){let svg=$('#wireCanvas');if(svg){svg.classList.toggle('zoomed',wireZoomed);let tools=document.createElement('div');tools.className='viewtools';tools.innerHTML='<button onclick="toggleWireZoom()">'+(wireZoomed?'⊟ Ver quadro completo':'⊕ Ampliar bornes')+'</button><small>Caixa branca · fileira DIN · vista didática aberta</small>';svg.closest('.wireScroll').before(tools)}}};
function toggleWireZoom(){wireZoomed=!wireZoomed;let svg=$('#wireCanvas');svg?.classList.toggle('zoomed',wireZoomed);let b=$('#main').querySelector('.viewtools button');if(b)b.textContent=wireZoomed?'⊟ Ver quadro completo':'⊕ Ampliar bornes'}
const spacedLabelSVG=wireSVG;wireSVG=function(){let svg=spacedLabelSVG();let overlay=makeWirePoints().groups.filter(g=>['main','idr','breaker','dps','load'].includes(g.type)).map(g=>{let y=g.type==='load'?g.y+55:g.y+g.h/2-5;let title=g.title.length>19?g.title.slice(0,18)+'…':g.title;return `<g aria-hidden="true"><rect x="${g.x+3}" y="${y-11}" width="${g.w-6}" height="15" rx="2" fill="#f4f6eb"/><text x="${g.x+g.w/2}" y="${y}" text-anchor="middle" font-size="11" font-weight="800" fill="#173d32" textLength="${Math.min(g.w-12,title.length*6)}" lengthAdjust="spacingAndGlyphs">${esc(title)}</text></g>`}).join('');return svg.replace('</svg>',overlay+'</svg>')};

const missionGoals=[['🏠','Separe iluminação e tomadas e organize seu primeiro quadro.'],['🍳','Planeje um circuito exclusivo para o forno elétrico.'],['💡','Distribua as cargas de uma casa pequena com eficiência.'],['🧺','Dimensione a alimentação da máquina de lavar e os demais circuitos.'],['💻','Separe o equipamento dedicado do escritório das outras tomadas.']];
missions=function(){$('#main').innerHTML=heading('Escolha seu próximo trabalho','Cinco missões para montar.','Escolha uma casa, planeje os circuitos e faça as ligações.')+`<div class="card" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b>Montagem atual · ${esc(scenarios[s.mission].title)}</b><p class="small">Seu progresso fica salvo neste dispositivo.</p></div><button onclick="show('work')">Retomar →</button></div><div class="gridcards">${briefs.map((b,i)=>{let total=b.loads.reduce((a,l)=>a+l[1],0);return `<article class="lesson"><div class="eyebrow">Missão 0${i+1} · ${i===1||i===3||i===4?'Intermediária':'Inicial'}</div><div style="font-size:30px;margin:10px 0">${missionGoals[i][0]}</div><h2>${esc(scenarios[i].title)}</h2><p>${missionGoals[i][1]}</p><p class="small"><b>${total.toLocaleString('pt-BR')} W · ${s.v} V · ${b.loads.length} grupos de cargas</b></p><details style="font-size:14px;margin:12px 0"><summary>Ver a casa e as cargas</summary><p>${esc(b.house)}</p>${b.loads.map(l=>`<div>${esc(l[0])}: ${l[1].toLocaleString('pt-BR')} W</div>`).join('')}</details><p class="small">${s.done.includes(i)?'✓ Concluída · 150 XP':'150 XP ao concluir'}</p><button class="primary space" onclick="start(${i},false)" aria-label="Escolher missão ${i+1}: ${esc(scenarios[i].title)}">${s.done.includes(i)?'Jogar novamente':'Escolher missão'} →</button></article>`}).join('')}</div>`};
enter=function(){$('#intro').classList.add('hidden');show('missions')};
start=function(i,free){if(!Number.isInteger(i)||!briefs[i])return;modal('<div class="eyebrow">Missão '+(i+1)+'</div><h2>'+esc(scenarios[i].title)+'</h2><p>'+esc(briefs[i].house)+'</p><p>'+missionGoals[i][1]+'</p><p class="small">Iniciar substitui somente a montagem atual. As missões concluídas e o XP serão mantidos.</p><button class="primary space" onclick="newBench('+i+',false)">Iniciar esta missão →</button>')};
const missionWork=work;work=function(){missionWork();let coach=$('#main').querySelector('.coachContent');if(coach){let button=document.createElement('button');button.textContent='Trocar missão';button.onclick=()=>show('missions');coach.append(button)}};
persist();render();
</script></body></html>
